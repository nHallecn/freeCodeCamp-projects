<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Shopping Cart Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-6">

    <div id="shopping-cart-container" class="flex flex-col lg:flex-row gap-6">

      <div id="products-container" class="flex-1 space-y-4">
        
        <div class="card bg-white p-4 rounded shadow">
          <h2 class="text-xl font-semibold">Guitar</h2>
          <div class="quantity">Quantity: 2</div>
          <div class="price">$500</div>
          <button class="remove-button bg-red-500 hover:bg-red-600 text-white px-3 py-1 mt-2 rounded">
            Remove
          </button>
        </div>

        <div class="card bg-white p-4 rounded shadow">
          <h2 class="text-xl font-semibold">Drum Set</h2>
          <div class="quantity">Quantity: 1</div>
          <div class="price">$800</div>
          <button class="remove-button bg-red-500 hover:bg-red-600 text-white px-3 py-1 mt-2 rounded">
            Remove
          </button>
        </div>

      </div>

      <div id="order-summary-container" class="w-64 bg-white p-4 rounded-lg border border-gray-300">
        <h2 class="text-2xl font-bold mb-4">Order Summary</h2>
        <div id="total" class="font-semibold text-lg mb-2">Total:</div>
        <div id="total-amount" class="mb-4">$1800</div>
        <a href="#" class="block text-center bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
          Checkout
        </a>
      </div>

    </div>

  </body>
</html>
