<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="app-container">
      <h1>Weather Dashboard</h1>

      <select id="city-select">
        <option value=""></option>
        <option value="new york">New York</option>
        <option value="los angeles">Los Angeles</option>
        <option value="chicago">Chicago</option>
        <option value="paris">Paris</option>
        <option value="tokyo">Tokyo</option>
        <option value="london">London</option>
      </select>

      <button id="get-weather-btn">Check Weather</button>

      <div id="weather-info">
        <h2 id="location"></h2>
        <img id="weather-icon" alt="" />
        <span id="weather-main"></span>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">Temperature</span>
            <span class="stat-value"><span id="main-temperature"></span>°C</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Feels Like</span>
            <span class="stat-value"><span id="feels-like"></span>°C</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Humidity</span>
            <span class="stat-value"><span id="humidity"></span>%</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Wind Speed</span>
            <span class="stat-value"><span id="wind"></span> m/s</span>
          </div>
          <div class="stat-item" style="grid-column: span 2;">
            <span class="stat-label">Wind Gust</span>
            <span class="stat-value"><span id="wind-gust"></span> m/s</span>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
